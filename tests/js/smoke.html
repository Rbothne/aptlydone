<!doctype html>
<meta charset="utf-8">
<title>smoke</title>
<iframe id="app" src="index.html" width="1200" height="900"></iframe>
<pre id="out">running</pre>
<script>
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
async function run() {
  const out = {};
  const frame = document.getElementById("app");
  await new Promise((resolve) => frame.addEventListener("load", resolve));
  const win = frame.contentWindow, doc = frame.contentDocument;
  win.localStorage.clear();
  for (let i = 0; i < 100 && !doc.querySelector(".unit"); i++) await wait(100);
  const count = () => doc.getElementById("count").textContent;
  const set = (id, value) => { const el = doc.getElementById(id); el.value = value; el.dispatchEvent(new Event("change")); };
  // first visit: the setup dialog is open; use it, then carry on with a clean slate
  out.setupOpen = doc.getElementById("setup").open;
  doc.querySelector('[data-sbeds="1"]').click();
  doc.getElementById("s-minSqft").value = "700";
  doc.getElementById("s-maxCost").value = "2600";
  doc.getElementById("s-income").value = "60000";
  doc.getElementById("s-go").click();
  await wait(200);
  out.setupClosed = !doc.getElementById("setup").open;
  out.afterSetup = count();
  out.setupFilters = JSON.parse(win.localStorage.getItem("apt.filters"));
  out.incomeNote = (doc.querySelector(".unit .note") || {}).textContent || null;
  out.welcomed = JSON.parse(win.localStorage.getItem("apt.settings")).welcomed;
  doc.getElementById("reset").click();
  out.standingChip = [...doc.querySelectorAll(".facts li")].map((li) => li.textContent).find((t) => /for its area/.test(t)) || null;
  doc.querySelector('[data-toggle="highEnd"]').click();
  out.highEnd = count();
  doc.querySelector('[data-toggle="highEnd"]').click();
  out.start = count();

  doc.querySelector(".unit").click();
  const detail = doc.querySelector(".detail");
  out.detail = detail ? detail.textContent.replace(/\s+/g, " ").slice(0, 400) : null;
  out.detailHasImage = Boolean(detail && detail.querySelector("img"));
  doc.querySelector(".unit").click();
  out.detailClosed = !doc.querySelector(".detail");

  doc.querySelector(".more").click();
  out.expandedRows = doc.querySelector(".building").querySelectorAll(".unit").length;

  doc.querySelector(".star").click();
  out.followedCount = doc.getElementById("n-followed").textContent;
  doc.querySelector('[data-tab="followed"]').click();
  out.followedRows = doc.querySelectorAll("#followed .unit").length;
  out.buildingsHidden = doc.getElementById("buildings").hidden;
  doc.querySelector('[data-tab="buildings"]').click();

  doc.querySelector('[data-beds="1"]').click();
  set("minSqft", "700");
  out.oneBed700 = count();
  set("maxCost", "2400");
  out.under2400 = count();
  doc.querySelector('[data-toggle="ground"]').click();
  out.ground = count();
  out.groundFloors = [...new Set(win.aptMatches().map((u) => u.floor))];
  doc.querySelector('[data-toggle="ground"]').click();
  doc.querySelector('[data-toggle="tagged"]').click();
  out.tagged = count();
  doc.querySelector('[data-toggle="tagged"]').click();
  const tick = (selector, on) => { const box = doc.querySelector(selector); box.checked = on; box.dispatchEvent(new Event("change")); };
  doc.getElementById("reset").click();
  tick('#areaspanel input[data-county="51013"]', true);
  out.arlington = count();
  out.areasLabel = doc.getElementById("areaslabel").textContent;
  tick('#areaspanel input[data-county="51510"]', true);
  out.arlingtonAndAlexandria = count();
  out.areasLabel2 = doc.getElementById("areaslabel").textContent;
  tick('#areaspanel input[data-state="Virginia"]', true);
  out.virginia = count();
  out.virginiaChosen = JSON.parse(win.localStorage.getItem("apt.filters")).counties.length;
  tick('#areaspanel input[data-state="Virginia"]', false);
  out.areasCleared = doc.getElementById("areaslabel").textContent;
  out.laundryFilterGone = !doc.querySelector('[data-toggle="laundry"]');
  // settings as text: export, wipe, import
  win.navigator.clipboard.writeText = async () => { throw new Error("no clipboard in this test"); };
  doc.getElementById("setupbtn").click();
  doc.getElementById("x-copy").click();
  await wait(100);
  const exported = doc.getElementById("x-text").value;
  out.exportHasFollows = exported.includes('"follows"') && exported.includes('"app": "apartment-tracker"');
  win.localStorage.removeItem("apt.follows");
  doc.getElementById("x-text").value = exported;
  doc.getElementById("x-import").click();
  out.importStatus = doc.getElementById("workstatus").textContent;
  out.followsRestored = JSON.parse(win.localStorage.getItem("apt.follows") || "[]").length;
  doc.getElementById("x-text").value = "not an export";
  doc.getElementById("setupbtn").click();
  doc.getElementById("x-import").click();
  out.badImport = doc.getElementById("x-status").textContent;
  doc.getElementById("s-skip").click();
  set("sort", "cost");
  set("sort", "cost");
  out.cheapestFirst = doc.querySelector(".unit .price b").textContent;
  out.saved = win.localStorage.getItem("apt.filters");
  doc.getElementById("reset").click();
  out.afterReset = count();
  doc.querySelector('[data-toggle="showRestricted"]').click();
  out.withRestricted = count();
  doc.getElementById("reset").click();
  const q = doc.getElementById("q"); q.value = "chevy chase"; q.dispatchEvent(new Event("input"));
  await wait(300);
  out.search = count();
  out.noPrices = (doc.querySelector(".noprices summary") || {}).textContent || null;
  doc.getElementById("reset").click();
  set("manager", "Camden");
  out.camden = count();
  set("manager", "");
  set("minRating", "4.5");
  out.rated45 = count();
  set("minRating", "");
  const slide = (id, value) => { const el = doc.getElementById(id); el.value = value; el.dispatchEvent(new Event("input")); };
  slide("maxViolent", "2");
  out.lowCrime = count();
  out.lowCrimeLabel = doc.getElementById("maxViolentOut").textContent;
  slide("maxViolent", "61");
  out.area = (doc.querySelector(".area") || {}).textContent || null;
  out.crimeChip = [...doc.querySelectorAll(".facts li")].map((li) => li.textContent).find((t) => /crime/i.test(t)) || null;
  doc.querySelector('[data-beds="1"]').click();
  set("minSqft", "700");
  const follow = doc.querySelector(".follow");
  out.followButton = follow.textContent;
  follow.click();
  out.followPressed = doc.querySelector(".follow").getAttribute("aria-pressed");
  doc.getElementById("reset").click();
  doc.querySelector('[data-tab="followed"]').click();
  out.followedHeadings = [...doc.querySelectorAll("#followed h3")].map((h) => h.textContent);
  out.followNote = (doc.querySelector("#followed .following") || {}).textContent || null;
  out.followedBuildingUnits = doc.querySelector("#followed .building") ? doc.querySelector("#followed .building").querySelectorAll(".unit").length : 0;
  out.followedBeds = [...new Set([...doc.querySelector("#followed .building").querySelectorAll(".unit .what")].map((w) => (w.textContent.match(/(Studio|\d bed)/) || [])[0]))];
  doc.querySelector('[data-tab="buildings"]').click();
  const nogo = doc.querySelector(".facts button");
  if (nogo) {
    out.nogoButton = nogo.textContent;
    nogo.click();
    out.afterNogo = count();
    out.nogoLine = doc.getElementById("nogo").textContent;
    doc.querySelector("#nogo button").click();
    out.afterNogoRemoved = count();
  }
  doc.querySelector('[data-tab="map"]').click();
  await wait(1500);
  out.mapDots = doc.querySelectorAll("#mapbox path.leaflet-interactive").length;
  out.mapTiles = doc.querySelectorAll("#mapbox img.leaflet-tile").length;
  out.mapHidden = doc.getElementById("map").hidden;
  const dot = doc.querySelector("#mapbox path.leaflet-interactive");
  if (dot) { dot.dispatchEvent(new MouseEvent("click", { bubbles: true, view: win })); await wait(400); }
  out.popup = (doc.querySelector(".leaflet-popup-content") || {}).textContent || null;
  doc.querySelector('[data-tab="buildings"]').click();
  document.getElementById("out").textContent = JSON.stringify(out, null, 1);
}
run().catch((error) => { document.getElementById("out").textContent = "ERROR " + error.stack; });
</script>
