<!doctype html>
<meta charset="utf-8">
<title>smoke</title>
<iframe id="app" src="index.html" width="1200" height="900"></iframe>
<pre id="out">running</pre>
<script>
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
async function run() {
  const out = {};
  const frame = document.getElementById("app");
  await new Promise((resolve) => frame.addEventListener("load", resolve));
  const win = frame.contentWindow, doc = frame.contentDocument;
  win.localStorage.clear();
  for (let i = 0; i < 100 && !doc.querySelector(".unit"); i++) await wait(100);
  const count = () => doc.getElementById("count").textContent;
  const set = (id, value) => { const el = doc.getElementById(id); el.value = value; el.dispatchEvent(new Event("change")); };
  out.start = count();

  doc.querySelector(".unit").click();
  const detail = doc.querySelector(".detail");
  out.detail = detail ? detail.textContent.replace(/\s+/g, " ").slice(0, 400) : null;
  out.detailHasImage = Boolean(detail && detail.querySelector("img"));
  doc.querySelector(".unit").click();
  out.detailClosed = !doc.querySelector(".detail");

  doc.querySelector(".more").click();
  out.expandedRows = doc.querySelector(".building").querySelectorAll(".unit").length;

  doc.querySelector(".star").click();
  out.followedCount = doc.getElementById("n-followed").textContent;
  doc.querySelector('[data-tab="followed"]').click();
  out.followedRows = doc.querySelectorAll("#followed .unit").length;
  out.buildingsHidden = doc.getElementById("buildings").hidden;
  doc.querySelector('[data-tab="buildings"]').click();

  doc.querySelector('[data-beds="1"]').click();
  set("minSqft", "700");
  out.oneBed700 = count();
  set("maxCost", "2400");
  out.under2400 = count();
  doc.querySelector('[data-toggle="ground"]').click();
  out.ground = count();
  out.groundFloors = [...new Set(win.aptMatches().map((u) => u.floor))];
  doc.querySelector('[data-toggle="ground"]').click();
  doc.querySelector('[data-toggle="tagged"]').click();
  out.tagged = count();
  doc.querySelector('[data-toggle="tagged"]').click();
  set("county", "51013");
  out.arlington = count();
  set("sort", "cost");
  out.cheapestFirst = doc.querySelector(".unit .price b").textContent;
  out.saved = win.localStorage.getItem("apt.filters");
  doc.getElementById("reset").click();
  out.afterReset = count();
  doc.querySelector('[data-toggle="showRestricted"]').click();
  out.withRestricted = count();
  doc.getElementById("reset").click();
  const q = doc.getElementById("q"); q.value = "chevy chase"; q.dispatchEvent(new Event("input"));
  await wait(300);
  out.search = count();
  out.noPrices = (doc.querySelector(".noprices summary") || {}).textContent || null;
  document.getElementById("out").textContent = JSON.stringify(out, null, 1);
}
run().catch((error) => { document.getElementById("out").textContent = "ERROR " + error.stack; });
</script>
