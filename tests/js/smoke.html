<!doctype html>
<meta charset="utf-8">
<title>smoke</title>
<iframe id="app" src="index.html" width="1200" height="900"></iframe>
<pre id="out">running</pre>
<script>
const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
async function run() {
  const out = {};
  const frame = document.getElementById("app");
  await new Promise((resolve) => frame.addEventListener("load", resolve));
  const win = frame.contentWindow, doc = frame.contentDocument;
  win.localStorage.clear();
  for (let i = 0; i < 100 && !doc.querySelector(".unit"); i++) await wait(100);
  const count = () => doc.getElementById("count").textContent;
  const set = (id, value) => { const el = doc.getElementById(id); el.value = value; el.dispatchEvent(new Event("change")); };
  const tick = (selector, on) => { const box = doc.querySelector(selector); box.checked = on; box.dispatchEvent(new Event("change")); };
  const tag = (key, on) => tick(`#tagspanel input[data-tag="${key}"]`, on);
  // first visit: the setup dialog is open; use it, then carry on with a clean slate
  out.setupOpen = doc.getElementById("setup").open;
  const step = () => doc.querySelector("#setup fieldset.step:not([hidden])").dataset.step;
  const press = (id) => doc.getElementById(id).click();
  const goTo = (name) => { for (let i = 0; i < 12 && step() !== name; i++) press("s-skip"); };       // skipping changes nothing
  out.steps = [doc.getElementById("s-where").textContent];
  out.backHiddenAtStart = doc.getElementById("s-prev").hidden && doc.getElementById("s-go").hidden;
  doc.querySelector('[data-sbeds="1"]').click();
  doc.getElementById("s-minSqft").value = "700";
  press("s-next");
  out.steps.push(doc.getElementById("s-where").textContent);
  doc.getElementById("s-maxCost").value = "2600";
  doc.getElementById("s-income").value = "60000";
  press("s-next");
  out.areaBoxes = doc.querySelectorAll("#s-areas input[data-scounty]").length;
  doc.querySelector('#s-areas input[data-scounty="24031"]').checked = true;
  press("s-skip");                                                       // skipped: Montgomery must not be chosen
  out.steps.push(step());
  press("s-skip");
  out.crimeOptions = [...doc.getElementById("s-maxViolentX").options].map((o) => o.textContent);
  out.crimeTypicalLine = doc.getElementById("s-crime-typical").textContent;
  doc.getElementById("s-maxViolentX").value = "1";
  out.crimeAsk = doc.querySelector('#setup .trade[data-trade="crime"] .ask').textContent;
  doc.querySelector('#setup .trade[data-trade="crime"] button[data-value="200"]').click();
  press("s-next");
  press("s-prev");
  out.backWorks = step();
  press("s-next");
  out.steps.push(step());
  press("s-next");
  out.steps.push(doc.getElementById("s-where").textContent);
  out.lastStepButtons = !doc.getElementById("s-go").hidden && doc.getElementById("s-next").hidden;
  doc.querySelector('#setup [data-stag="quietAir"]').checked = true;
  press("s-go");
  await wait(200);
  out.values = JSON.parse(win.localStorage.getItem("apt.settings")).values;
  out.setupClosed = !doc.getElementById("setup").open;
  out.afterSetup = count();
  out.setupFilters = JSON.parse(win.localStorage.getItem("apt.filters"));
  out.incomeNote = (doc.querySelector(".unit .note") || {}).textContent || null;
  out.welcomed = JSON.parse(win.localStorage.getItem("apt.settings")).welcomed;
  doc.getElementById("reset").click();
  out.standingChip = [...doc.querySelectorAll(".facts li")].map((li) => li.textContent).find((t) => /for its area/.test(t)) || null;
  tag("highEnd", true);
  out.highEnd = count();
  out.tagsLabel1 = doc.getElementById("tagslabel").textContent;
  tag("highEnd", false);
  out.start = count();
  out.tagButtonsGone = !doc.querySelector('[data-toggle="tagged"], [data-toggle="nearMetro"], [data-toggle="ground"]');

  doc.querySelector(".unit").click();
  const detail = doc.querySelector(".detail");
  out.detail = detail ? detail.textContent.replace(/\s+/g, " ").slice(0, 400) : null;
  out.detailHasImage = Boolean(detail && detail.querySelector("img"));
  doc.querySelector(".unit").click();
  out.detailClosed = !doc.querySelector(".detail");

  doc.querySelector(".more").click();
  out.expandedRows = doc.querySelector(".building").querySelectorAll(".unit").length;

  // following a unit puts its whole building under Followed, as the same card the list shows
  const starredName = doc.querySelector("#buildings .building h2 a").textContent;
  const listRows = doc.querySelector("#buildings .building").querySelectorAll(".unit").length;
  doc.querySelector("#buildings .building .star").click();
  out.followedCount = doc.getElementById("n-followed").textContent;
  doc.querySelector('[data-tab="followed"]').click();
  out.followedCards = doc.querySelectorAll("#followed article.building").length;
  out.followedIsThatBuilding = doc.querySelector("#followed .building h2 a").textContent === starredName;
  out.followedRows = doc.querySelectorAll("#followed .unit").length;
  out.followedShowsTheBuildingsListings = out.followedRows === listRows && listRows > 1;
  out.followedFirstRowIsTheStar = doc.querySelector("#followed .unit .star").getAttribute("aria-pressed") === "true";
  out.followedOtherRowsAreNot = [...doc.querySelectorAll("#followed .unit .star")].filter((s) => s.getAttribute("aria-pressed") === "true").length === 1;
  out.followedCardIsFull = Boolean(doc.querySelector("#followed .building .facts")) && Boolean(doc.querySelector("#followed .building .onmap"));
  out.followedCountLine = doc.getElementById("count").textContent;
  out.buildingsHidden = doc.getElementById("buildings").hidden;
  doc.querySelector('[data-tab="buildings"]').click();

  doc.querySelector('[data-beds="1"]').click();
  set("minSqft", "700");
  out.oneBed700 = count();
  set("maxCost", "2400");
  out.under2400 = count();
  tag("ground", true);
  out.ground = count();
  out.groundFloors = [...new Set(win.aptMatches().map((u) => u.floor))];
  tag("ground", false);
  tick('#tagspanel input[data-group="Deals"]', true);
  out.tagged = count();
  out.taggedKinds = [...new Set(win.aptMatches().map((u) => u.tag))].sort();
  out.tagsLabelDeals = doc.getElementById("tagslabel").textContent;
  tag("building", false);
  tag("local", false);
  out.absoluteOnly = count();
  out.absoluteKinds = [...new Set(win.aptMatches().map((u) => u.tag))];
  out.dealsGroupHalfTicked = doc.querySelector('#tagspanel input[data-group="Deals"]').indeterminate;
  tick('#tagspanel input[data-group="Deals"]', false);
  doc.getElementById("reset").click();
  tick('#areaspanel input[data-county="51013"]', true);
  out.arlington = count();
  out.areasLabel = doc.getElementById("areaslabel").textContent;
  tick('#areaspanel input[data-county="51510"]', true);
  out.arlingtonAndAlexandria = count();
  out.areasLabel2 = doc.getElementById("areaslabel").textContent;
  tick('#areaspanel input[data-state="Virginia"]', true);
  out.virginia = count();
  out.virginiaChosen = JSON.parse(win.localStorage.getItem("apt.filters")).counties.length;
  tick('#areaspanel input[data-state="Virginia"]', false);
  out.areasCleared = doc.getElementById("areaslabel").textContent;
  out.laundryFilterGone = !doc.querySelector('[data-toggle="laundry"]');
  // settings as text: export, wipe, import
  win.navigator.clipboard.writeText = async () => { throw new Error("no clipboard in this test"); };
  doc.getElementById("setupbtn").click();
  doc.getElementById("x-copy").click();
  await wait(100);
  const exported = doc.getElementById("x-text").value;
  out.exportHasFollows = exported.includes('"follows"') && exported.includes('"app": "apartment-tracker"');
  win.localStorage.removeItem("apt.follows");
  doc.getElementById("x-text").value = exported;
  doc.getElementById("x-import").click();
  out.importStatus = doc.getElementById("workstatus").textContent;
  out.followsRestored = JSON.parse(win.localStorage.getItem("apt.follows") || "[]").length;
  doc.getElementById("x-text").value = "not an export";
  doc.getElementById("setupbtn").click();
  doc.getElementById("x-import").click();
  out.badImport = doc.getElementById("x-status").textContent;
  doc.getElementById("s-close").click();
  out.closedWithoutChange = !doc.getElementById("setup").open;
  set("sort", "cost");
  set("sort", "cost");
  out.cheapestFirst = doc.querySelector(".unit .price b").textContent;
  out.saved = win.localStorage.getItem("apt.filters");
  doc.getElementById("reset").click();
  out.afterReset = count();
  doc.querySelector('[data-toggle="showRestricted"]').click();
  out.withRestricted = count();
  doc.getElementById("reset").click();
  const q = doc.getElementById("q"); q.value = "chevy chase"; q.dispatchEvent(new Event("input"));
  await wait(300);
  out.search = count();
  out.noPrices = (doc.querySelector(".noprices summary") || {}).textContent || null;
  doc.getElementById("reset").click();
  set("manager", "Camden");
  out.camden = count();
  set("manager", "");
  set("minRating", "4.5");
  out.rated45 = count();
  set("minRating", "");
  const slide = (id, value) => { const el = doc.getElementById(id); el.value = value; el.dispatchEvent(new Event("input")); };
  slide("maxViolentX", "1");
  out.lowCrime = count();
  out.lowCrimeLabel = doc.getElementById("maxViolentXOut").textContent;
  out.lowCrimeWorst = Math.max(...win.aptMatches().map((u) => win.aptBuilding(u.building).crime.x));
  slide("maxViolentX", "7");
  out.crimeAnyLabel = doc.getElementById("maxViolentXOut").textContent;
  out.area = (doc.querySelector(".area") || {}).textContent || null;
  out.crimeChip = [...doc.querySelectorAll(".facts li")].map((li) => li.textContent).find((t) => /crime/i.test(t)) || null;
  doc.querySelector('[data-beds="1"]').click();
  set("minSqft", "700");
  const follow = doc.querySelector(".follow");
  out.followButton = follow.textContent;
  follow.click();
  out.followPressed = doc.querySelector(".follow").getAttribute("aria-pressed");
  doc.getElementById("reset").click();
  doc.querySelector('[data-tab="followed"]').click();
  // Followed is the list under the same filters: no headings, no remembered sizes, and the filters narrow it like any list
  out.followedHeadings = [...doc.querySelectorAll("#followed h3")].map((h) => h.textContent);
  out.followedNoCriteriaNote = ![...doc.querySelectorAll("#followed .following")].some((p) => /Following for/.test(p.textContent));
  out.followedBuildings = doc.querySelectorAll("#followed article.building").length;
  out.followedTabCount = doc.getElementById("n-followed").textContent;
  const unstarredBeds = () => [...new Set([...doc.querySelectorAll("#followed .unit")]
    .filter((row) => row.querySelector(".star").getAttribute("aria-pressed") !== "true")
    .map((row) => (row.querySelector(".what").textContent.match(/(Studio|\d bed)/) || [])[0]))].sort();
  for (const more of doc.querySelectorAll("#followed .more")) if (/Show all/.test(more.textContent)) more.click();
  out.followedBedsUnfiltered = unstarredBeds();
  doc.querySelector('[data-beds="2"]').click();
  for (const more of doc.querySelectorAll("#followed .more")) if (/Show all/.test(more.textContent)) more.click();
  out.followedBedsTwoBedFilter = unstarredBeds();
  out.followedStillAllThere = doc.querySelectorAll("#followed article.building").length === out.followedBuildings;
  out.followedStarStillShown = [...doc.querySelectorAll("#followed .unit .star")].some((s) => s.getAttribute("aria-pressed") === "true");
  doc.getElementById("reset").click();
  doc.querySelector('[data-tab="buildings"]').click();
  const nogo = doc.querySelector(".facts button");
  if (nogo) {
    out.nogoButton = nogo.textContent;
    nogo.click();
    out.afterNogo = count();
    out.nogoLine = doc.getElementById("nogo").textContent;
    doc.querySelector("#nogo button").click();
    out.afterNogoRemoved = count();
  }
  // nearby places, walkability and dogs
  out.nearbyLine = (doc.querySelector(".nearby") || {}).textContent || null;
  out.walkChip = [...doc.querySelectorAll(".facts li")].map((li) => li.textContent).find((t) => /walk/i.test(t)) || null;
  out.dogChip = [...doc.querySelectorAll(".facts li")].map((li) => li.textContent).find((t) => /dog/i.test(t)) || null;
  const all = count();
  for (const name of ["nearMetro", "nearGrocery", "nearPark", "dogFriendly"]) {
    tag(name, true);
    out[name] = count();
    tag(name, false);
  }
  tag("nearMetro", true);
  tag("nearGrocery", true);
  out.metroAndGrocery = count();
  out.tagsLabelTwo = doc.getElementById("tagslabel").textContent;
  out.tagsSaved = JSON.parse(win.localStorage.getItem("apt.filters")).nearGrocery;
  tag("nearMetro", false);
  tag("nearGrocery", false);
  out.togglesReleased = count() === all;
  slide("minWalk", "16");
  out.walk16 = count();
  out.walk16Label = doc.getElementById("minWalkOut").textContent;
  const walkScores = () => [...doc.querySelectorAll("#buildings .facts li")].map((li) => (li.textContent.match(/Walkability ([\d.]+)/) || [])[1]).filter(Boolean).map(Number);
  out.walk16Lowest = Math.min(...walkScores());
  set("sort", "walk");
  out.mostWalkableFirst = walkScores()[0];
  doc.getElementById("reset").click();
  // price drops, what a unit's own listing says, noise and construction
  tag("drop", true);
  out.drops = count();
  out.dropChips = doc.querySelectorAll("#buildings .tag.drop").length > 0;
  out.dropTitle = (doc.querySelector("#buildings .tag.drop") || {}).title || null;
  set("sort", "drop");
  out.biggestDropFirst = win.aptMatches().reduce((low, u) => Math.min(low, u.drop.pct), 0);
  out.firstShownDrop = (doc.querySelector("#buildings .tag.drop") || {}).title || null;
  tag("drop", false);
  set("sort", "picks");
  tag("balcony", true);
  out.balcony = count();
  out.balconyNotes = [...new Set(win.aptMatches().map((u) => u.outdoor))].sort();
  tag("balcony", false);
  tag("ownDoor", true);
  tag("ground", true);
  out.ownDoorGround = count();
  out.ownDoorNote = (doc.querySelector("#buildings .unit .note[title*=door]") || {}).textContent || null;
  tag("ownDoor", false);
  tag("ground", false);
  tag("quietAir", true);
  out.quietAir = count();
  out.loudestLeft = Math.max(...win.aptMatches().map((u) => (win.aptBuilding(u.building).noise || {}).air || 0));
  tag("quietAir", false);
  tag("noSites", true);
  out.noSites = count();
  tag("noSites", false);
  out.allAgain = count() === all;
  const chips = [...doc.querySelectorAll("#buildings .facts li")];
  const everyFact = win.aptFacts();
  out.noiseChip = everyFact.find((t) => /noise/i.test(t)) || null;
  out.siteChip = everyFact.find((t) => /Building site next door/.test(t)) || null;
  out.workChip = everyFact.find((t) => /in this building/.test(t)) || null;
  out.crimeChipTypical = chips.map((li) => li.textContent).find((t) => /typical/.test(t)) || null;
  doc.querySelector("#buildings .unit").click();
  out.ranking = [...doc.querySelectorAll("#buildings .detail h3")].map((h3) => h3.textContent);
  out.rankingText = ([...doc.querySelectorAll("#buildings .detail section")].find((s) => /Top picks/.test(s.textContent)) || {}).textContent || null;
  doc.querySelector("#buildings .unit").click();
  out.footerTypical = doc.getElementById("crime-typical").textContent;
  doc.getElementById("reset").click();
  // the Google key stays in this browser and out of the export
  doc.getElementById("setupbtn").click();
  goTo("commute");
  doc.getElementById("s-key").value = "TEST-KEY-not-real";
  doc.getElementById("s-leave").value = "07:15";
  out.commuteAsk = doc.querySelector('#setup .trade[data-trade="commute"] .ask').textContent;
  press("s-finish");
  await wait(200);
  const kept = JSON.parse(win.localStorage.getItem("apt.settings"));
  out.keyKept = kept.googleKey === "TEST-KEY-not-real" && kept.leave === "07:15";
  doc.getElementById("setupbtn").click();
  doc.getElementById("x-copy").click();
  await wait(100);
  out.keyNotExported = !doc.getElementById("x-text").value.includes("TEST-KEY");
  out.valuesExported = doc.getElementById("x-text").value.includes('"values"');
  goTo("commute");
  doc.getElementById("s-key").value = "";
  press("s-finish");
  await wait(200);
  out.keyCleared = JSON.parse(win.localStorage.getItem("apt.settings")).googleKey == null;
  doc.querySelector('[data-tab="map"]').click();
  await wait(1500);
  out.mapDots = doc.querySelectorAll("#mapbox path.leaflet-interactive").length;
  out.mapTiles = doc.querySelectorAll("#mapbox img.leaflet-tile").length;
  out.mapHidden = doc.getElementById("map").hidden;
  const dot = doc.querySelector("#mapbox path.leaflet-interactive");
  if (dot) { dot.dispatchEvent(new MouseEvent("click", { bubbles: true, view: win })); await wait(400); }
  out.popup = (doc.querySelector(".leaflet-popup-content") || {}).textContent || null;
  out.popupLines = [...doc.querySelectorAll(".leaflet-popup-content p")].map((p) => p.textContent);
  out.popupAsksForWork = out.popupLines.includes("Set a work address to see the drive from here") && !doc.querySelector("#mapbox path.trip");
  // from the map to the same building in the list: filters untouched, the card in view and marked
  const before = count();
  const named = doc.querySelector(".leaflet-popup-content b").textContent;
  [...doc.querySelectorAll(".leaflet-popup-content button")].find((b) => /in the list/.test(b.textContent)).click();
  await wait(200);
  const found = doc.querySelector("#buildings article.found");
  out.wentToList = !doc.getElementById("buildings").hidden && doc.getElementById("map").hidden;
  out.foundCard = found ? found.querySelector("h2 a").textContent : null;
  out.foundIsTheOne = Boolean(found) && found.querySelector("h2 a").textContent === named;
  out.filtersUntouched = count() === before && doc.getElementById("q").value === "";
  out.cardInView = found ? Math.round(found.getBoundingClientRect().top) : null;
  out.barHeight = doc.getElementById("top").offsetHeight;
  out.cardsDrawn = doc.querySelectorAll("#buildings article.building").length;
  // tabs remember where you were
  const listScroll = win.scrollY;
  doc.querySelector('[data-tab="map"]').click();
  await wait(200);
  out.mapScroll = win.scrollY;
  out.popupStillOpen = Boolean(doc.querySelector(".leaflet-popup-content"));
  doc.querySelector('[data-tab="buildings"]').click();
  await wait(100);
  out.listScrollKept = listScroll > 0 && Math.abs(win.scrollY - listScroll) < 3;
  // from the list to the map
  const card = doc.querySelector("#buildings article.found") || doc.querySelector("#buildings article.building");
  const wanted = card.querySelector("h2 a").textContent;
  card.querySelector(".onmap").click();
  await wait(600);
  out.onMapTab = !doc.getElementById("map").hidden;
  out.onMapPopup = ((doc.querySelector(".leaflet-popup-content b") || {}).textContent || null) === wanted;
  out.onMapZoom = win.aptMapZoom();
  doc.querySelector('[data-tab="buildings"]').click();
  // the drive to work on the map, with the two public services stood in for (nothing leaves this machine)
  const asked = { route: 0 };
  const realFetch = win.fetch.bind(win);
  win.fetch = async (url, options) => {
    const u = String(url);
    const json = (body) => ({ ok: true, status: 200, json: async () => body });
    if (u.includes("nominatim.openstreetmap.org")) return json([{ lat: "38.8977", lon: "-77.0063", display_name: "Union Station, Washington, District of Columbia" }]);
    if (u.includes("/table/v1/")) {
      const n = u.split("/driving/")[1].split("?")[0].split(";").length;
      return json({ code: "Ok", durations: [Array.from({ length: n }, (_, i) => i * 60)] });
    }
    if (u.includes("/route/v1/")) {
      asked.route += 1;
      const [[alon, alat], [blon, blat]] = u.split("/driving/")[1].split("?")[0].split(";").map((pair) => pair.split(",").map(Number));
      return json({ code: "Ok", routes: [{ duration: 900, geometry: { coordinates: [[alon, alat], [alon, blat], [(alon + blon) / 2, blat], [blon, blat]] } }] });
    }
    return realFetch(url, options);
  };
  doc.getElementById("reset").click();
  doc.getElementById("work").value = "Union Station, Washington DC";
  doc.getElementById("setwork").click();
  await wait(1500);
  out.tripTimed = doc.getElementById("workstatus").textContent;
  doc.querySelector('[data-tab="map"]').click();
  await wait(300);
  win.aptMapClose();
  await wait(100);
  out.tripNoLineBeforeAClick = !doc.querySelector("#mapbox path.trip");
  doc.querySelector("#mapbox path.leaflet-interactive").dispatchEvent(new MouseEvent("click", { bubbles: true, view: win }));
  await wait(600);
  out.tripPopupLine = [...doc.querySelectorAll(".leaflet-popup-content p.trip")].map((p) => p.textContent);
  out.tripLineDrawn = doc.querySelectorAll("#mapbox path.trip").length;
  out.tripLineIsTheRoute = Boolean(doc.querySelector("#mapbox path.trip.routed"));
  out.tripLineNotInTheWay = win.getComputedStyle(doc.querySelector("#mapbox path.trip")).pointerEvents === "none";
  const tripHome = win.aptBuilding(Object.keys(win.aptMapOpen ? { [win.aptMapOpen()]: 1 } : {})[0]);
  win.aptMapZoomTo(tripHome, 17);                      // close in on the home, so the work place is out of view
  await wait(300);
  out.tripWorkOutOfViewUpClose = !win.aptMapSees(win.aptWork()) && win.aptMapSees(tripHome);
  [...doc.querySelectorAll(".leaflet-popup-content button")].find((b) => /whole trip/.test(b.textContent)).click();
  await wait(600);
  out.tripWholeShowsBothEnds = win.aptMapSees(win.aptWork()) && win.aptMapSees(tripHome);
  // the pop-up would sit on top of the line, so it is put away and the line is labelled instead
  out.tripWholePutsThePopupAway = !doc.querySelector(".leaflet-popup-content") && doc.querySelectorAll("#mapbox path.trip.routed").length === 1;
  out.tripWholeLabel = (doc.querySelector("#mapbox .triplabel") || {}).textContent || null;
  doc.querySelector('[data-beds="1"]').click();                           // a redraw (a filter change) keeps it
  await wait(200);
  out.tripWholeSurvivesARedraw = doc.querySelectorAll("#mapbox path.trip").length === 1 && Boolean(doc.querySelector("#mapbox .triplabel"));
  doc.querySelector('[data-beds="1"]').click();
  win.aptMapClick();                                                       // a click on the map itself puts it away
  await wait(500);                                                         // the label fades out over a fifth of a second
  out.tripWholeGoneOnMapClick = !doc.querySelector("#mapbox path.trip") && !doc.querySelector("#mapbox .triplabel");
  // an ordinary pop-up: the line goes when the pop-up is closed
  doc.querySelector("#mapbox path.leaflet-interactive").dispatchEvent(new MouseEvent("click", { bubbles: true, view: win }));
  await wait(300);
  out.tripBackWithAPopup = doc.querySelectorAll("#mapbox path.trip").length === 1 && !doc.querySelector("#mapbox .triplabel");
  win.aptMapClose();
  await wait(200);
  out.tripLineGoneWhenClosed = !doc.querySelector("#mapbox path.trip");
  const routesAsked = asked.route;
  doc.querySelector('[data-tab="buildings"]').click();
  const tripCard = doc.querySelector("#buildings article.building");
  tripCard.querySelector(".onmap").click();
  await wait(600);
  out.tripFromTheList = doc.querySelectorAll("#mapbox path.trip").length === 1;
  win.aptMapClose();
  tripCard.querySelector(".onmap").click();
  await wait(600);
  out.tripRoutesAsked = [routesAsked, asked.route];
  // no work place: no line
  doc.getElementById("work").value = "";
  doc.getElementById("setwork").click();
  await wait(300);
  out.tripGoneWithoutWork = !doc.querySelector("#mapbox path.trip");
  win.fetch = realFetch;
  win.aptMapClose();
  doc.querySelector('[data-tab="buildings"]').click();
  // on the Map tab an open filter panel is drawn over the map, not under it. The map's tiles ignore the pointer, so asking
  // "what is at this point" cannot see them on top; what can be checked is that the map keeps its high layers to itself
  // (the library stacks them at 400 to 1000, the filter bar sits at 5) and that the bar is above the map.
  doc.querySelector('[data-tab="map"]').click();
  await wait(300);
  const layers = [...doc.querySelectorAll("#mapbox .leaflet-pane, #mapbox .leaflet-top")].map((el) => Number(win.getComputedStyle(el).zIndex) || 0);
  out.mapLayersStackHigh = Math.max(...layers) > Number(win.getComputedStyle(doc.getElementById("top")).zIndex);
  out.mapKeepsItsLayersToItself = win.getComputedStyle(doc.getElementById("mapbox")).isolation === "isolate";
  // and the map's own buttons can still be reached
  const plus = doc.querySelector(".leaflet-control-zoom-in"), at = plus.getBoundingClientRect();
  out.mapZoomButtonReachable = doc.elementFromPoint(Math.round(at.left + at.width / 2), Math.round(at.top + at.height / 2)) === plus
    || plus.contains(doc.elementFromPoint(Math.round(at.left + at.width / 2), Math.round(at.top + at.height / 2)));
  doc.querySelector('[data-tab="buildings"]').click();
  // who lives nearby: limits on the tract's median age, degrees, and race and ethnicity
  doc.getElementById("reset").click();
  // opened by a click, as a person would; then typing applies without leaving the box
  doc.querySelector("#people summary").dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: win }));
  await wait(100);
  out.peopleOpensOnClick = doc.getElementById("people").open && doc.querySelectorAll("#peoplepanel .bound").length === 7;
  const limit = async (key, side, value) => {
    const el = doc.querySelector(`#peoplepanel input[data-measure="${key}"][data-side="${side}"]`);
    el.dispatchEvent(new MouseEvent("click", { bubbles: true, cancelable: true, view: win }));
    el.focus(); el.value = value; el.dispatchEvent(new Event("input", { bubbles: true }));
    await wait(400);
    el.blur();
  };
  const places = () => [...new Set(win.aptMatches().map((u) => u.building))].map((id) => win.aptBuilding(id).place);
  const everything = count();
  await limit("age", 0, "30"); await limit("age", 1, "40");
  out.peopleStaysOpenWhileTyping = doc.getElementById("people").open;
  out.peopleAge = count();
  out.peopleAgeLabel = doc.getElementById("peoplelabel").textContent;
  out.peopleAgeHolds = places().every((p) => Math.round(p.age) >= 30 && Math.round(p.age) <= 40) && count() !== everything;
  await limit("degree", 0, "80");
  out.peopleDegree = count();
  out.peopleDegreeHolds = places().every((p) => p.degree >= 80);
  out.peopleSaved = JSON.stringify(JSON.parse(win.localStorage.getItem("apt.filters")).area);
  await limit("asian", 0, "15");
  out.peopleRace = count();
  out.peopleRaceLabel = doc.getElementById("peoplelabel").textContent;
  out.peopleRaceHolds = places().every((p) => p.race.asian >= 15);
  // switched off, the race limits are hidden and stop applying; the others stay
  const sw = doc.getElementById("demographics");
  sw.checked = false; sw.dispatchEvent(new Event("change"));
  out.peopleRaceOffCountBack = count() === out.peopleDegree;
  out.peopleRaceRowsHidden = [...doc.querySelectorAll("#peoplepanel [data-race]")].every((row) => row.hidden)
    && !doc.querySelector("#peoplepanel [data-norace]").hidden;
  out.peopleRaceOffLabel = doc.getElementById("peoplelabel").textContent;
  sw.checked = true; sw.dispatchEvent(new Event("change"));
  out.peopleRaceBackOn = count() === out.peopleRace;
  doc.querySelector('[data-tab="followed"]').click();
  out.peopleOnFollowed = doc.getElementById("count").textContent;
  doc.querySelector('[data-tab="buildings"]').click();
  doc.getElementById("reset").click();
  out.peopleReset = count() === everything && doc.getElementById("peoplelabel").textContent === "Any"
    && [...doc.querySelectorAll("#peoplepanel input")].every((el) => el.value === "");
  // "On the map" as the very first look at the map: a fresh page, straight from the list
  await new Promise((resolve) => { frame.addEventListener("load", resolve, { once: true }); win.location.reload(); });
  const win2 = frame.contentWindow, doc2 = frame.contentDocument;
  for (let i = 0; i < 100 && !doc2.querySelector(".unit"); i++) await wait(100);
  if (doc2.getElementById("setup").open) doc2.getElementById("s-close").click();
  const first = doc2.querySelector("#buildings article.building");
  first.querySelector(".onmap").click();
  await wait(800);
  out.firstMapZoom = win2.aptMapZoom();
  out.firstMapSeesIt = win2.aptMapSees(win2.aptBuilding(first.dataset.id));
  out.firstMapPopup = ((doc2.querySelector(".leaflet-popup-content b") || {}).textContent || null) === first.querySelector("h2 a").textContent;
  // a mistyped search is guessed at, and the page owns up to it
  const type = async (text) => { const box = doc2.getElementById("q"); box.value = text; box.dispatchEvent(new Event("input")); await wait(400); };
  const shown = () => doc2.querySelectorAll("#buildings article.building").length;
  doc2.querySelector('[data-tab="buildings"]').click();
  await type("bethesda");
  out.searchExact = shown();
  out.searchExactSilent = doc2.getElementById("guess").hidden;
  await type("bethseda");
  out.searchGuessed = shown() === out.searchExact && shown() > 0;
  out.searchGuessNote = doc2.getElementById("guess").hidden ? null : doc2.getElementById("guess").textContent;
  out.searchKeepsWhatWasTyped = doc2.getElementById("q").value === "bethseda";
  await type("qqqqzzzz");
  out.searchNoGuess = shown() === 0 ? doc2.getElementById("guess").textContent : null;
  await type("");
  out.searchCleared = doc2.getElementById("guess").hidden && shown() > 0;
  document.getElementById("out").textContent = JSON.stringify(out, null, 1);
}
run().catch((error) => { document.getElementById("out").textContent = "ERROR " + error.stack; });
</script>
