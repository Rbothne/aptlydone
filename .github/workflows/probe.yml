name: Probe

# Can GitHub's servers read the building sites? Run this by hand ("Run workflow") before relying on the
# schedule. It reads one building per listing system and saves nothing.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Exits (aptrack/vpn.py): a site that refuses GitHub's address is asked through Cloudflare WARP, registered
    # fresh each run unless WARP_PROFILE holds one, and through any WireGuard configs or proxies in the secrets.
    env:
      WARP_PROFILE: ${{ secrets.WARP_PROFILE }}
      APTRACK_WG_CONFS: ${{ secrets.APTRACK_WG_CONFS }}
      APTRACK_PROXIES: ${{ secrets.APTRACK_PROXIES }}
    steps:
      - uses: actions/checkout@v4

      - name: Get a few buildings to try
        run: bash .github/scripts/data-branch.sh load || python3 discover.py --limit 3

      - name: Read one building per listing system
        run: python3 build.py --probe
