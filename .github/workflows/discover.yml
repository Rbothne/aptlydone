name: Find buildings and area data

on:
  schedule:
    - cron: "40 9 * * 1"        # Mondays, about 4:40 am Eastern
  workflow_dispatch:

permissions:
  contents: write               # to replace the data branch

concurrency:                    # shared with the unit tracking, so the two never race on the data branch
  group: tracking
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 90         # was 180 while Dweck's five-minute crawl delay was kept (dropped 2026-11-27)
    # Exits (aptrack/vpn.py): a site that refuses GitHub's address is asked through Cloudflare WARP, registered
    # fresh each run unless WARP_PROFILE holds one, and through any WireGuard configs or proxies in the secrets.
    env:
      WARP_PROFILE: ${{ secrets.WARP_PROFILE }}
      APTRACK_WG_CONFS: ${{ secrets.APTRACK_WG_CONFS }}
      APTRACK_PROXIES: ${{ secrets.APTRACK_PROXIES }}
    steps:
      - uses: actions/checkout@v4

      - name: Get the latest data
        run: bash .github/scripts/data-branch.sh load || true

      - name: Find buildings
        run: python3 discover.py

      # Census figures, crime near each building and ZIP rent trends change slowly: collect them here, weekly.
      # Google ratings come from the Places API with the GOOGLE_MAPS_KEY secret; without it they are skipped.
      - name: Collect area data
        run: python3 area.py
        env:
          GOOGLE_MAPS_KEY: ${{ secrets.GOOGLE_MAPS_KEY }}

      - name: Save the data
        run: bash .github/scripts/data-branch.sh save
